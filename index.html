<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>構文150マスターアプリ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ============ パスワード認証画面 ============ -->
<div id="auth-gate" class="auth-gate">
  <div class="auth-box">
    <p class="app-title" style="font-size:22px;"> 構文150マスターアプリ　校内専用ページ</p>
    <p class="app-sub">パスワードを入力してください</p>
    <input type="password" id="auth-password" class="auth-input" placeholder="パスワード">
    <button id="auth-submit" class="btn-primary">入る</button>
    <p id="auth-error" class="error-text"></p>
  </div>
</div>

<div class="app" id="app-root" style="display:none;">

  <!-- ============ 設定画面 ============ -->
  <section id="screen-settings" class="screen">
    <h1 class="app-title">構文150 クイズ</h1>
    <p class="app-sub">登録済みの構文：<span id="total-count">0</span>個</p>

   <div class="field">
  <label>出題範囲</label>

  <div class="range-inputs">
    <div class="range-input">
      <label for="start-number">何番から</label>
      <input type="number" id="start-number" min="1" value="1">
    </div>

    <div class="range-input">
      <label for="num-questions">何個</label>
      <input type="number" id="num-questions" min="1" value="10">
    </div>
  </div>
</div>

    <div class="field">
      <label>出題形式</label>
      <div class="radio-row">
        <label class="radio-pill"><input type="radio" name="direction" value="ja2en" checked><span>日本語 → 英語</span></label>
        <label class="radio-pill"><input type="radio" name="direction" value="en2ja"><span>英語 → 日本語</span></label>
        <label class="radio-pill"><input type="radio" name="direction" value="mix"><span>ランダム混合</span></label>
      </div>
    </div>

    <div class="field field-checkbox">
      <label class="checkbox-row">
        <input type="checkbox" id="shuffle-order" checked>
        <span>出題順をシャッフルする</span>
      </label>
    </div>

    <button id="btn-start" class="btn-primary">はじめる</button>
    <p id="settings-error" class="error-text"></p>
  </section>

  <!-- ============ クイズ画面 ============ -->
  <section id="screen-quiz" class="screen hidden">
    <div class="quiz-top">
      <span id="progress-text">1 / 10</span>
      <span id="score-text">正解 0</span>
    </div>
    <div class="progress-track"><div id="progress-bar" class="progress-bar"></div></div>

    <div class="card">
      <p class="pattern-no">構文 No. <span id="pattern-no">1</span></p>
      <p id="question-text" class="question-text"></p>
      <p id="answer-text" class="answer-text hidden"></p>
    </div>　
    
　　<button id="btn-reveal" class="btn-primary">答えを見る</button>

<div id="judge-row" class="judge-row hidden">
  <button id="btn-wrong" class="btn-judge btn-wrong">不正解</button>
  <button id="btn-correct" class="btn-judge btn-correct">正解</button>
</div>

<button id="btn-quit" class="btn-secondary">クイズをやめて、ホームに戻る</button>
    
  </section>

  <!-- ============ 結果画面 ============ -->
  <section id="screen-result" class="screen hidden">
    <h1 class="app-title">結果</h1>
    <p class="result-score"><span id="result-correct">0</span> / <span id="result-total">0</span> 問正解</p>
    <p class="result-percent" id="result-percent">0%</p>

    <div id="review-wrap" class="review-wrap hidden">
      <p class="review-title">復習リスト（不正解だった構文）</p>
      <ul id="review-list" class="review-list"></ul>
    </div>

    <button id="btn-restart" class="btn-primary">もう一度設定する</button>
  </section>

</div>

<script>
(function () {
  const CORRECT_PASSWORD = '150';
  const AUTH_KEY = 'koubun150-auth';

  const authGate = document.getElementById('auth-gate');
  const appRoot = document.getElementById('app-root');
  const passInput = document.getElementById('auth-password');
  const submitBtn = document.getElementById('auth-submit');
  const errorEl = document.getElementById('auth-error');

  function unlock() {
    authGate.style.display = 'none';
    appRoot.style.display = 'block';
  }

  // 過去にパスワード認証済みなら（localStorageに記録があれば）自動で表示
  if (sessionStorage.getItem(AUTH_KEY) === 'ok') {
    unlock();
  }

  function tryLogin() {
    if (passInput.value === CORRECT_PASSWORD) {
      sessionStorage.setItem(AUTH_KEY, 'ok');
      errorEl.textContent = '';
      unlock();
    } else {
      errorEl.textContent = 'パスワードが違います。';
      passInput.value = '';
      passInput.focus();
    }
  }

  submitBtn.addEventListener('click', tryLogin);
  passInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') tryLogin();
  });
})();
</script>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
